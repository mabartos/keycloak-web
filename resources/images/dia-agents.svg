<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360">
  <!-- User -->
  <g transform="translate(60, 100)">
    <circle cx="50" cy="35" r="25" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
    <circle cx="50" cy="28" r="11" fill="#9e9e9e"/>
    <path d="M25,56 Q50,46 75,56" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
    <text x="50" y="90" font-family="Arial, sans-serif" font-size="16" fill="#4d4d4d" text-anchor="middle">User</text>
  </g>

  <!-- Arrow: User → Keycloak -->
  <g transform="translate(165, 130)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#c0c0c0" stroke-width="2"/>
    <polygon points="80,0 72,-5 72,5" fill="#c0c0c0"/>
    <text x="40" y="-10" font-family="Arial, sans-serif" font-size="11" fill="#9e9e9e" text-anchor="middle">authenticates</text>
  </g>

  <!-- Keycloak -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(60, 15)">
      <polygon points="40,0 80,20 80,60 40,80 0,60 0,20" fill="#4d4d4d" transform="scale(0.6)"/>
      <polygon points="20,20 40,10 60,20 60,60 40,70 20,60" fill="#e0e0e0" transform="scale(0.6)"/>
      <polygon points="35,25 40,15 50,25 50,55 40,60 35,55" fill="#00b8e3" transform="scale(0.6)"/>
      <polygon points="30,40 35,25 50,25 45,40 50,55 35,55" fill="#008aaa" transform="scale(0.6)"/>
    </g>
    <text x="100" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4d4d4d" text-anchor="middle">KEYCLOAK</text>
    <text x="100" y="100" font-family="Arial, sans-serif" font-size="11" fill="#9e9e9e" text-anchor="middle">Token Exchange</text>
    <text x="100" y="115" font-family="Arial, sans-serif" font-size="11" fill="#9e9e9e" text-anchor="middle">DPoP · CIBA</text>
  </g>

  <!-- Arrow: Keycloak → Agent (token) -->
  <g transform="translate(455, 130)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#00b8e3" stroke-width="2"/>
    <polygon points="80,0 72,-5 72,5" fill="#00b8e3"/>
    <text x="40" y="-10" font-family="Arial, sans-serif" font-size="11" fill="#008aaa" text-anchor="middle">token</text>
  </g>

  <!-- AI Agent -->
  <g transform="translate(540, 60)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5"/>
    <!-- Robot/Agent icon -->
    <g transform="translate(70, 15)">
      <rect x="5" y="15" width="50" height="35" rx="6" fill="none" stroke="#9e9e9e" stroke-width="2"/>
      <circle cx="20" cy="30" r="5" fill="#9e9e9e"/>
      <circle cx="40" cy="30" r="5" fill="#9e9e9e"/>
      <line x1="30" y1="5" x2="30" y2="15" stroke="#9e9e9e" stroke-width="2"/>
      <circle cx="30" cy="4" r="3" fill="#9e9e9e"/>
      <line x1="0" y1="30" x2="5" y2="30" stroke="#9e9e9e" stroke-width="2"/>
      <line x1="55" y1="30" x2="60" y2="30" stroke="#9e9e9e" stroke-width="2"/>
    </g>
    <text x="100" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4d4d4d" text-anchor="middle">AI Agent</text>
    <text x="100" y="105" font-family="Arial, sans-serif" font-size="11" fill="#9e9e9e" text-anchor="middle">Acts on behalf of user</text>
    <text x="100" y="120" font-family="Arial, sans-serif" font-size="11" fill="#9e9e9e" text-anchor="middle">with scoped token</text>
  </g>

  <!-- Arrow: Agent → APIs -->
  <g transform="translate(745, 95)">
    <line x1="0" y1="35" x2="60" y2="0" stroke="#c0c0c0" stroke-width="2"/>
    <polygon points="60,0 51,0 55,8" fill="#c0c0c0"/>
  </g>
  <g transform="translate(745, 130)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#c0c0c0" stroke-width="2"/>
    <polygon points="60,0 52,-5 52,5" fill="#c0c0c0"/>
  </g>
  <g transform="translate(745, 130)">
    <line x1="0" y1="0" x2="60" y2="50" stroke="#c0c0c0" stroke-width="2"/>
    <polygon points="60,50 51,48 56,42" fill="#c0c0c0"/>
  </g>

  <!-- API / Service 1 -->
  <g transform="translate(810, 55)">
    <rect x="0" y="0" width="170" height="50" rx="8" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5"/>
    <!-- Server icon -->
    <rect x="15" y="12" width="26" height="8" rx="2" fill="none" stroke="#9e9e9e" stroke-width="1.5"/>
    <rect x="15" y="24" width="26" height="8" rx="2" fill="none" stroke="#9e9e9e" stroke-width="1.5"/>
    <circle cx="35" cy="16" r="2" fill="#9e9e9e"/>
    <circle cx="35" cy="28" r="2" fill="#9e9e9e"/>
    <text x="55" y="30" font-family="Arial, sans-serif" font-size="13" fill="#4d4d4d">REST API</text>
  </g>

  <!-- API / Service 2 -->
  <g transform="translate(810, 115)">
    <rect x="0" y="0" width="170" height="50" rx="8" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5"/>
    <rect x="15" y="12" width="26" height="8" rx="2" fill="none" stroke="#9e9e9e" stroke-width="1.5"/>
    <rect x="15" y="24" width="26" height="8" rx="2" fill="none" stroke="#9e9e9e" stroke-width="1.5"/>
    <circle cx="35" cy="16" r="2" fill="#9e9e9e"/>
    <circle cx="35" cy="28" r="2" fill="#9e9e9e"/>
    <text x="55" y="30" font-family="Arial, sans-serif" font-size="13" fill="#4d4d4d">MCP Server</text>
  </g>

  <!-- API / Service 3 -->
  <g transform="translate(810, 175)">
    <rect x="0" y="0" width="170" height="50" rx="8" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5"/>
    <rect x="15" y="12" width="26" height="8" rx="2" fill="none" stroke="#9e9e9e" stroke-width="1.5"/>
    <rect x="15" y="24" width="26" height="8" rx="2" fill="none" stroke="#9e9e9e" stroke-width="1.5"/>
    <circle cx="35" cy="16" r="2" fill="#9e9e9e"/>
    <circle cx="35" cy="28" r="2" fill="#9e9e9e"/>
    <text x="55" y="30" font-family="Arial, sans-serif" font-size="13" fill="#4d4d4d">Microservice</text>
  </g>
</svg>