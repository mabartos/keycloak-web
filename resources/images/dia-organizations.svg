<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400">
  <!-- Keycloak logo area (center-left) -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="280" height="160" rx="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1.5"/>
    <!-- Keycloak icon simplified -->
